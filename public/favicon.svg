<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="plannixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#818cf8" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Rounded Shield Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0b0f19" />
  <rect x="4" y="4" width="56" height="56" rx="16" stroke="url(#plannixGrad)" stroke-width="2.5" />
  
  <!-- Stylized Task Checklist Icon with Golden/Cyan Glow -->
  <path d="M20 22h24M20 32h14" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <!-- Checkmark -->
  <circle cx="44" cy="38" r="10" fill="url(#plannixGrad)" filter="url(#glow)" />
  <path d="M39.5 38l3 3 6-6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
