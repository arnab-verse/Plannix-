<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Plannix</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The page you requested could not be found. Return to Plannix task management dashboard." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b0f19;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 24px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(129, 140, 248, 0.1);
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffd700;
        border: 1px solid rgba(251, 191, 36, 0.4);
        border-radius: 9999px;
        margin-bottom: 20px;
        background: rgba(251, 191, 36, 0.08);
      }
      h1 {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e2e8f0;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #ffffff;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 14px;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Made by Arnab-verse</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The link or screen you were looking for doesn't exist or has moved. Let's get you back to your tasks.</p>
      <a href="/" class="btn">
        <span>Return to Plannix</span>
        &rarr;
      </a>
    </div>
  </body>
</html>
