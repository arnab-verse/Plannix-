<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#fff4b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#818cf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="280" fill="#38bdf8" fill-opacity="0.08" filter="blur(80px)" />
  <circle cx="1000" cy="480" r="320" fill="#c084fc" fill-opacity="0.08" filter="blur(90px)" />

  <!-- App Card Preview Mockup Frame -->
  <rect x="100" y="80" width="1000" height="470" rx="32" fill="#13192b" stroke="#334155" stroke-width="2" filter="url(#glow)" />
  
  <!-- Badge -->
  <g transform="translate(150, 130)">
    <rect width="220" height="38" rx="19" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="110" y="24" fill="#ffd700" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">MADE BY ARNAB-VERSE</text>
  </g>

  <!-- Main Branding -->
  <text x="150" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    Plannix <tspan fill="#94a3b8" font-size="36" font-weight="500">(Your Task Manager)</tspan>
  </text>

  <!-- Tagline -->
  <text x="150" y="300" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Intelligent Daily Task Execution &amp; Midnight Rollover Tracking
  </text>

  <!-- Feature Pills -->
  <g transform="translate(150, 350)">
    <rect x="0" y="0" width="220" height="48" rx="14" fill="#1e293b" stroke="#475569" />
    <text x="110" y="30" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">&#10004; Deadline Aware</text>

    <rect x="240" y="0" width="220" height="48" rx="14" fill="#1e293b" stroke="#475569" />
    <text x="350" y="30" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">&#128337; Midnight Rollover</text>

    <rect x="480" y="0" width="220" height="48" rx="14" fill="#1e293b" stroke="#475569" />
    <text x="590" y="30" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">&#128202; Analytics &amp; History</text>

    <rect x="720" y="0" width="200" height="48" rx="14" fill="#1e293b" stroke="#475569" />
    <text x="820" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">&#128274; Cloud Sync</text>
  </g>

  <!-- Bottom Details -->
  <text x="150" y="470" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">
    Production-Ready PWA &bull; Multi-Device Responsive &bull; Firebase Powered
  </text>
</svg>
